<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة مراكز مبيعات ليبيانا - التحديث المركزي</title>
    <style>
        :root {
            --bg-color: #f8f6fc;
            --container-bg: #ffffff;
            --text-color: #2b2b2b;
            --border-color: #dcd6f7;
            --input-bg: #ffffff;
            --input-text: #2b2b2b;
            --table-header: #5e35b1;
            --table-header-text: #ffffff;
            --table-alt: #f3eafd;
            --result-bg: #ede7f6;
            --primary-purple: #5e35b1;
            --primary-purple-hover: #4527a0;
        }

        [data-theme="dark"] {
            --bg-color: #121019;
            --container-bg: #1a1625;
            --text-color: #e4e1ed;
            --border-color: #3b3054;
            --input-bg: #241f33;
            --input-text: #ffffff;
            --table-header: #7e57c2;
            --table-header-text: #ffffff;
            --table-alt: #221c30;
            --result-bg: #28203d;
            --primary-purple: #7e57c2;
            --primary-purple-hover: #9575cd;
        }

        body { font-family: Tahoma, sans-serif; margin: 0; padding: 20px; background: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; }
        .container { max-width: 950px; margin: auto; background: var(--container-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(94, 53, 177, 0.08); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .brand-section { display: flex; align-items: center; gap: 15px; }
        .libyana-logo {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #5e35b1, #b39ddb);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 20px; box-shadow: 0 3px 8px rgba(94, 53, 177, 0.3);
        }

        h1 { color: var(--primary-purple); margin: 0; font-size: 24px; }
        .controls { display: flex; gap: 10px; }
        .btn { padding: 9px 16px; background: var(--primary-purple); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: var(--primary-purple-hover); }
        .btn-danger { background: #d32f2f; }
        .btn-secondary { background: #757575; }

        .search-box { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        input { flex: 1; min-width: 250px; padding: 11px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--input-bg); color: var(--input-text); outline: none; }
        .tips { font-size: 12px; opacity: 0.75; margin-bottom: 20px; }
        #result { margin-bottom: 20px; padding: 14px; background: var(--result-bg); border-radius: 6px; font-weight: 500; border-right: 4px solid var(--primary-purple); line-height: 1.6; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: right; }
        th { background: var(--table-header); color: var(--table-header-text); font-weight: 600; }
        tr:nth-child(even) { background: var(--table-alt); }

        .admin-section { margin-top: 15px; padding: 20px; border: 2px dashed var(--primary-purple); border-radius: 8px; display: none; background: var(--result-bg); }
        .admin-section.active { display: block; }
        .loading-text { font-size: 13px; color: var(--primary-purple); font-weight: bold; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-bar">
        <div class="brand-section">
            <div class="libyana-logo">Ly</div>
            <div>
                <h1>مراكز مبيعات ليبيانا</h1>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="toggleTheme()">🌓 وضع العرض</button>
            <button class="btn" id="adminLoginBtn" onclick="toggleAdminMode()">🔐 دخول المشرفين</button>
        </div>
    </div>
    
    <div class="search-box">
        <input type="text" id="areaInput" placeholder="اكتب اسم الشارع أو المنطقة (مثلاً: عمر المختار، تاجوراء، بنغازي)...">
        <button class="btn" onclick="findNearestByTextSmart()">ابحث عن أقرب مركز</button>
    </div>
    <div id="result">جاري تحميل أحدث البيانات المركزية...</div>

    <!-- لوحة المشرفين -->
    <div id="adminPanel" class="admin-section">
        <h3 style="margin-top: 0; color: var(--primary-purple);"> : إضافة مركز مبيعات جديد </h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
            <input type="text" id="newCity" placeholder="المدينة">
            <input type="text" id="newName" placeholder="اسم المركز">
            <input type="text" id="newDesc" placeholder="الوصف (مثلاً: بجانب مسجد)">
            <input type="text" id="newTime" placeholder="توقيت العمل (مثلاً: 08 ص - 03 م)">
            <input type="number" step="any" id="newLat" placeholder="خط العرض تقريبي">
            <input type="number" step="any" id="newLng" placeholder="خط الطول تقريبي">
        </div>
        <button class="btn" id="saveBtn" onclick="addNewCenter()">حفظ وتحديث القائمة </button>
        <span id="statusMsg" class="loading-text" style="display:none; margin-right: 10px;">جاري التحديث السحابي...</span>
    </div>

    <!-- جدول المراكز -->
    <h3 style="color: var(--primary-purple);">دليل مراكز المبيعات المعتمد</h3>
    <table>
        <thead>
            <tr>
                <th>المدينة والمركز</th>
                <th>وصف الموقع</th>
                <th>توقيت العمل</th>
                <th class="admin-col" style="display:none;">إجراءات</th>
            </tr>
        </thead>
        <tbody id="centersTableBody">
            <!-- يُعبأ تلقائياً من قاعدة البيانات -->
        </tbody>
    </table>
</div>

<script>
    // إعدادات الربط السحابي مع JSONbin (ضع مفاتيحك الخاصة هنا لتفعيل الربط التلقائي)
   const BIN_ID = '6acce1f0ffd5d1605364518c';
const API_KEY = '$2a$10$3ExnK78umB2m0Ngf5wn6.uvMYiWSDS7neSAkms91YLADmnh.N/bm6';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const keywordMap = [
        { keywords: ["طرابلس", "عمر المختار", "الجزيرة", "بن عاشور", "الظهرة", "سوق الجمعة"], lat: 32.8872, lng: 13.1913, city: "طرابلس" },
        { keywords: ["تاجوراء", "المستوصف"], lat: 32.8797, lng: 13.3856, city: "تاجوراء" },
        { keywords: ["حي الأندلس", "قرقارش"], lat: 32.8423, lng: 13.1631, city: "طرابلس" },
        { keywords: ["بنغازي", "جمال عبد الناصر", "البركة"], lat: 32.1194, lng: 20.0686, city: "بنغازي" },
        { keywords: ["مصراتة", "وسط المدينة"], lat: 32.3754, lng: 15.0925, city: "مصراتة" }
    ];

    let libyanaCenters = [
        { name: "مركز طرابلس الرئيسي", city: "طرابلس", desc: "بجانب الجزيرة الكبرى", time: "08:00 ص - 03:00 م", lat: 32.8872, lng: 13.1913 },
        { name: "مركز تاجوراء", city: "طرابلس", desc: "مقابل مستوصف تاجوراء", time: "08:30 ص - 02:30 م", lat: 32.8797, lng: 13.3856 },
        { name: "مركز حي الأندلس", city: "طرابلس", desc: "بالقرب من الجزيرة التجارية", time: "08:00 ص - 03:00 م", lat: 32.8423, lng: 13.1631 },
        { name: "مركز بنغازي الرئيسي", city: "بنغازي", desc: "شارع جمال عبد الناصر", time: "08:00 ص - 03:00 م", lat: 32.1194, lng: 20.0686 }
    ];

    let isAdmin = false;

    // جلب أحدث بيانات سحابياً عند فتح الصفحة
    async function loadCloudCenters() {
        if (!BIN_ID || BIN_ID.includes('ضع_هنا')) {
            document.getElementById('result').innerText = "اكتب اسم الشارع أو المنطقة في الحقل أعلاه لمعرفة أقرب مركز مبيعات والمسافة فوراً.";
            renderTable();
            return;
        }

        try {
            const res = await fetch(`${API_URL}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await res.json();
            if (data.record && Array.isArray(data.record)) {
                libyanaCenters = data.record;
            }
            document.getElementById('result').innerText = "تم تحديث أحدث بيانات المراكز بنجاح. اكتب المنطقة للبحث.";
        } catch (e) {
            console.warn("تعذر الجلب السحابي، جاري استخدام البيانات المحلية:", e);
            document.getElementById('result').innerText = "اكتب اسم الشارع أو المنطقة في الحقل أعلاه لمعرفة أقرب مركز مبيعات والمسافة فوراً.";
        }
        renderTable();
    }

    // حفظ البيانات سحابياً عند إضافة مركز جديد
    async function saveCloudCenters() {
        if (!BIN_ID || BIN_ID.includes('ضع_هنا')) return true;

        document.getElementById('statusMsg').style.display = 'inline';
        try {
            await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(libyanaCenters)
            });
            document.getElementById('statusMsg').style.display = 'none';
            return true;
        } catch (e) {
            alert("حدث خطأ أثناء حفظ التعديل سحابياً، يرجى التأكد من الاتصال بالإنترنت.");
            document.getElementById('statusMsg').style.display = 'none';
            return false;
        }
    }

    function renderTable() {
        const tbody = document.getElementById('centersTableBody');
        tbody.innerHTML = '';

        libyanaCenters.forEach((center, index) => {
            let row = `<tr>
                <td><b>${center.city}</b> - ${center.name}</td>
                <td>${center.desc}</td>
                <td>${center.time}</td>`;
            
            if (isAdmin) {
                row += `<td class="admin-col"><button class="btn btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="deleteCenter(${index})">حذف</button></td>`;
            }
            row += `</tr>`;
            tbody.innerHTML += row;
        });

        document.querySelectorAll('.admin-col').forEach(el => {
            el.style.display = isAdmin ? 'table-cell' : 'none';
        });
    }

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        body.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
    }

    function toggleAdminMode() {
        if (!isAdmin) {
            let pass = prompt("الرجاء إدخال كلمة مرور المشرف:");
            if (pass === "libyana2026") {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('adminLoginBtn').innerText = "🔓 خروج المشرف";
                renderTable();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminLoginBtn').innerText = "🔐 دخول المشرفين";
            renderTable();
        }
    }

    async function addNewCenter() {
        const city = document.getElementById('newCity').value;
        const name = document.getElementById('newName').value;
        const desc = document.getElementById('newDesc').value;
        const time = document.getElementById('newTime').value;
        const lat = parseFloat(document.getElementById('newLat').value);
        const lng = parseFloat(document.getElementById('newLng').value);

        if (!city || !name || isNaN(lat) || isNaN(lng)) {
            alert("الرجاء تعبئة كافة بيانات المركز والإحداثيات بشكل صحيح.");
            return;
        }

        libyanaCenters.push({ name, city, desc, time, lat, lng });
        const saved = await saveCloudCenters();
        
        if (saved) {
            document.getElementById('newCity').value = '';
            document.getElementById('newName').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newTime').value = '';
            document.getElementById('newLat').value = '';
            document.getElementById('newLng').value = '';

            renderTable();
            alert("تمت الإضافة بنجاح وتحديث الموقع للجميع فوراً!");
        }
    }

    async function deleteCenter(index) {
        if (confirm("هل أنت متأكد من حذف هذا المركز لجميع المستخدمين؟")) {
            libyanaCenters.splice(index, 1);
            const saved = await saveCloudCenters();
            if (saved) renderTable();
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function findNearestByTextSmart() {
        const query = document.getElementById('areaInput').value.trim();
        if (!query) {
            alert('الرجاء كتابة اسم الشارع أو المنطقة أولاً');
            return;
        }

        document.getElementById('result').innerHTML = `⏳ جاري البحث عن الموقع وقياس المسافة عبر الإنترنت...`;

        let userLat, userLng, locationName;

        try {
            // استخدام خدمة جغرافية مجانية عبر الإنترنت لجلب إحداثيات أي مكان في ليبيا يكتبه المستخدم
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Libya')}`);
            const data = await response.json();

            if (data && data.length > 0) {
                userLat = parseFloat(data[0].lat);
                userLng = parseFloat(data[0].lon);
                locationName = data[0].display_name;
            } else {
                // إذا لم يتم العثور عليها بدقة، نلجأ لمركز طرابلس الافتراضي
                userLat = 32.8872;
                userLng = 13.1913;
                locationName = query + " (تم التوجيه لطرابلس لعدم دقة الاسم الجغرافي)";
            }
        } catch (error) {
            console.warn("خطأ في الاتصال بخدمة الخرائط، استخدام الإحداثيات الافتراضية:", error);
            userLat = 32.8872;
            userLng = 13.1913;
            locationName = query;
        }

        let nearest = null;
        let minDistance = Infinity;

        libyanaCenters.forEach(center => {
            const dist = calculateDistance(userLat, userLng, center.lat, center.lng);
            if (dist < minDistance) {
                minDistance = dist;
                nearest = center;
            }
        });

        // عرض النتيجة بدقة تامة وبدون تداخل في التنسيق
        document.getElementById('result').innerHTML = `
            📍 <b>الموقع المُحدد:</b> ${locationName}<br>
            🏢 <b>أقرب مركز مبيعات:</b> <span style="color: var(--primary-purple);"><b>${nearest.city} - ${nearest.name}</b></span> (${nearest.desc})<br>
            📏 <b>المسافة التقريبية:</b> ${minDistance.toFixed(2)} كم &nbsp;|&nbsp; ⏰ <b>توقيت العمل:</b> ${nearest.time}
        `;
    }

    loadCloudCenters();
</script>
<footer style="text-align: center; padding: 15px; margin-top: 30px; font-size: 14px; color: #666; border-top: 1px solid #eee;">

</footer>
 
</body>
</html>
